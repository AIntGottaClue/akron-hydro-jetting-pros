name: Prepare Cloudflare source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update production domain and build files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://example.com'
          new = 'https://topekahydrojetting.prosapp.site'
          for p in Path('.').rglob('*'):
              if p.is_file() and p.suffix in ('.html', '.xml', '.txt') and '.git' not in p.parts and 'dist' not in p.parts:
                  text = p.read_text()
                  if old in text:
                      p.write_text(text.replace(old, new))
          Path('package.json').write_text('''{"name":"topeka-hydro-jetting-pros","private":true,"version":"1.0.0","scripts":{"build":"rm -rf dist && mkdir dist && cp -R assets college-hill hi-crest highland-park how-hydro-jetting-works hydro-jetting-vs-snaking mineral-and-scale-deposits oakland potwin preventative-maintenance privacy recurring-clogs-and-slow-drains severe-grease-and-sludge terms tree-root-intrusions westboro index.html robots.txt sitemap.xml dist/"}}\n''')
          Path('wrangler.jsonc').write_text('''{"name":"topeka-hydro-jetting-pros","compatibility_date":"2026-09-27","assets":{"directory":"./dist"}}\n''')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || (git commit -m 'Prepare production domain and Cloudflare static assets' && git push)
